[project]
name = "async-node"
version = "2.0.0"
description = "**AsyncNode** is a Python asynchronous computation wrapper that allows you to create, chain, combine, and execute asynchronous computations flexibly, optionally using executors for CPU-bound or IO-bound tasks. It supports wrapping synchronous and asynchronous computations, chaining operations using `map`, `run`, `consume`, combining multiple `AsyncNode` instances, handling exceptions synchronously or asynchronously, and lazy evaluation with caching. `Schedulers` is a centralized factory for executors that provides **singleton-style access**, meaning each executor instance (IO-bound, CPU-bound, or single-threaded) is created only once and reused throughout your application. Executors are lazily instantiated when first accessed."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loky>=3.5.6",
]
